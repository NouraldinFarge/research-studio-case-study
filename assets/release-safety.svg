<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Research Studio portable release activation and rollback</title>
  <desc id="desc">A source verification gate builds a portable candidate, checks the Electron SQLite runtime and smoke tests it, preserves durable data, then activates it. Failed activation restores the previous build.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081322"/><stop offset="1" stop-color="#18132b"/></linearGradient><filter id="s2"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg2)"/>
  <text x="60" y="78" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">Portable release: verify before activation</text>
  <text x="60" y="116" fill="#a9bad0" font-family="Segoe UI,Arial,sans-serif" font-size="19">The prior build remains recoverable until the candidate passes in its packaged runtime.</text>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#s2)">
    <g transform="translate(55 190)"><rect width="180" height="150" rx="20" fill="#0d2236" stroke="#31516e"/><text x="24" y="48" fill="#7dd3fc" font-size="15" font-weight="700">01 · SOURCE GATE</text><text x="24" y="84" fill="#f8fafc" font-size="21" font-weight="700">Check + build</text><text x="24" y="116" fill="#9fb4cf" font-size="15">Types · lint · tests</text></g>
    <g transform="translate(285 190)"><rect width="180" height="150" rx="20" fill="#0d2236" stroke="#31516e"/><text x="24" y="48" fill="#7dd3fc" font-size="15" font-weight="700">02 · CANDIDATE</text><text x="24" y="84" fill="#f8fafc" font-size="21" font-weight="700">Portable ZIP</text><text x="24" y="116" fill="#9fb4cf" font-size="15">One versioned folder</text></g>
    <g transform="translate(515 190)"><rect width="180" height="150" rx="20" fill="#161a32" stroke="#6557a0"/><text x="24" y="48" fill="#c4b5fd" font-size="15" font-weight="700">03 · RUNTIME</text><text x="24" y="84" fill="#f8fafc" font-size="21" font-weight="700">ABI + smoke</text><text x="24" y="116" fill="#b9acd9" font-size="15">Electron loads SQLite</text></g>
    <g transform="translate(745 190)"><rect width="180" height="150" rx="20" fill="#161a32" stroke="#6557a0"/><text x="24" y="48" fill="#c4b5fd" font-size="15" font-weight="700">04 · STATE</text><text x="24" y="84" fill="#f8fafc" font-size="21" font-weight="700">Preserve data</text><text x="24" y="116" fill="#b9acd9" font-size="15">Data only · reset cache</text></g>
    <g transform="translate(975 190)"><rect width="170" height="150" rx="20" fill="#10271f" stroke="#2c6b55"/><text x="22" y="48" fill="#5eead4" font-size="15" font-weight="700">05 · ACTIVATE</text><text x="22" y="84" fill="#f8fafc" font-size="21" font-weight="700">Swap safely</text><text x="22" y="116" fill="#a9cabb" font-size="15">Verify active path</text></g>
  </g>
  <g stroke="#60a5fa" stroke-width="4" fill="#60a5fa"><path d="M240 265h32"/><path d="M470 265h32"/><path d="M700 265h32"/><path d="M930 265h32"/><path d="M272 265l-10-7v14z"/><path d="M502 265l-10-7v14z"/><path d="M732 265l-10-7v14z"/><path d="M962 265l-10-7v14z"/></g>
  <path d="M1060 350v90H660" fill="none" stroke="#f87171" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M660 440l14-9v18z" fill="#f87171"/>
  <rect x="350" y="395" width="310" height="100" rx="18" fill="#32171e" stroke="#8b3949"/>
  <text x="378" y="432" fill="#fca5a5" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">ACTIVATION CHECK FAILS</text>
  <text x="378" y="467" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Restore prior active build</text>
  <rect x="60" y="530" width="1085" height="48" rx="16" fill="#0b1c2d" stroke="#29445f"/>
  <text x="85" y="560" fill="#b6c8da" font-family="Segoe UI,Arial,sans-serif" font-size="17">No installer · no service · no scheduled task · previous build retained until verification completes</text>
</svg>
