name: Case-study question
description: Ask about a documented engineering decision or suggest a clarification.
title: "[Case study]: "
labels: [documentation]
body:
  - type: textarea
    id: question
    attributes:
      label: Question or clarification
      description: Reference the relevant section and avoid requesting private source or data.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Repository boundary
      options:
        - label: I understand that source, binaries, private catalogs, and authentication artifacts are not distributed here.
          required: true

