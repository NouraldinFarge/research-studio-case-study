version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
      day: monday

  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
      day: monday
    groups:
      documentation-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
