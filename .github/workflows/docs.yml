name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint case-study documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Restore locked documentation dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint

      - name: Enforce source-free publication boundary
        shell: bash
        run: |
          forbidden_files="$(find . -type f \
            \( -iname '*.zip' -o -iname '*.exe' -o -iname '*.dll' -o -iname '*.node' \
               -o -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*.db' -o -iname '*.har' \
               -o -iname '*.pem' -o -iname '*.pfx' -o -iname '*.key' \) \
            -not -path './.git/*' -not -path './node_modules/*' -print)"
          if [ -n "$forbidden_files" ]; then
            echo "Forbidden private or binary artifact detected:"
            echo "$forbidden_files"
            exit 1
          fi
          if grep -RIE \
            --exclude-dir=.git --exclude-dir=node_modules --exclude='*.png' --exclude='*.svg' \
            '(D:\\Extensions_Programs|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer|Cookie:[[:space:]])' .; then
            echo 'Potential local path, credential, or session material detected.'
            exit 1
          fi
